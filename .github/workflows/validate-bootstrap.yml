name: validate-bootstrap

on:
  pull_request:
    paths: &paths
      - ".chezmoiscripts/run_once_before_05-setup-case-sensitive-volume.py"
      - ".github/tests/test_case_sensitive_volume.py"
      - ".github/workflows/validate-bootstrap.yml"
  push:
    branches: [main]
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test bootstrap logic
        run: python3 -m unittest discover --start-directory .github/tests --pattern "test_case_sensitive_volume.py"
