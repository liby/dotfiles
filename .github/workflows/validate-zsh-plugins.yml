name: validate-zsh-plugins

on:
  pull_request:
    paths: &paths
      - ".chezmoiexternal.toml"
      - ".github/workflows/actions.lock"
      - ".github/workflows/validate-zsh-plugins.yml"
      - "dot_zshrc"
  push:
    branches: [main]
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # renovate: datasource=github-releases depName=twpayne/chezmoi
      CHEZMOI_VERSION: v2.73.2
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zsh
          installer="$RUNNER_TEMP/install-chezmoi.sh"
          curl --fail --location --retry 5 --retry-all-errors \
            --silent --show-error \
            --output "$installer" \
            https://get.chezmoi.io
          for attempt in 1 2 3; do
            if sh "$installer" \
              -b "$RUNNER_TEMP/bin" \
              -t "$CHEZMOI_VERSION"; then
              break
            fi
            if ((attempt == 3)); then
              exit 1
            fi
          done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Apply pinned plugin archives
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/source"
          home_dir="$RUNNER_TEMP/home"
          mkdir -p "$source_dir" "$home_dir/.zsh/plugins"
          cp .chezmoiexternal.toml "$source_dir/"
          for attempt in 1 2 3; do
            if chezmoi apply \
              --config /dev/null \
              --config-format toml \
              --persistent-state "$RUNNER_TEMP/chezmoi-state" \
              --source "$source_dir" \
              --destination "$home_dir" \
              --include externals \
              --refresh-externals=always \
              --no-tty; then
              break
            fi
            if ((attempt == 3)); then
              exit 1
            fi
          done
      - name: Load the plugins dot_zshrc sources
        shell: zsh {0}
        env:
          HOME: ${{ runner.temp }}/home
          TERM: xterm-256color
        run: |
          set -euo pipefail
          autoload -Uz compinit
          compinit -u -d "$HOME/.zcompdump"
          plugins=(${(f)"$(grep -v '^[[:space:]]*#' dot_zshrc | grep -o '\.zsh/plugins/[^"[:space:]]*')"})
          # A plugin dot_zshrc loads in a form this extraction misses would otherwise go untested.
          for dir in $HOME/.zsh/plugins/*(/); do
            ((${plugins[(I)${dir#$HOME/}/*]})) || { print -u2 "dot_zshrc sources nothing from ${dir#$HOME/}"; exit 1 }
          done
          for plugin in $plugins; do
            source "$HOME/$plugin"
          done
