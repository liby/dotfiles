name: validate-hooks

on:
  pull_request:
    paths: &paths
      - ".chezmoitemplates/claude/settings.json"
      - ".chezmoitemplates/codex/config.toml"
      - ".chezmoitemplates/codex/requirements.toml"
      - ".github/workflows/actions.lock"
      - ".github/workflows/validate-hooks.yml"
      - "dot_claude/hooks/**"
      - "dot_claude/scripts/**"
      - "dot_codex/managed-hooks/**"
      - "dot_local/share/claude-launcher/**"
      - "dot_zprofile"
      - "dot_zshenv"
  push:
    branches: [main]
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hooks:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
      # The Brewfile installs the scanner the hook runs, so the test takes it
      # from the same channel rather than a pinned copy machines never run.
      - name: Install the secret scanner
        run: brew install gitleaks
      - name: Test Claude launcher
        run: zsh dot_local/share/claude-launcher/bin/claude.test.zsh
      - name: Test agent hooks
        run: |
          for t in dot_claude/hooks/*.test.sh dot_claude/scripts/*.test.sh; do
            echo "== $t"
            bash "$t"
          done
          bun test ./dot_codex/managed-hooks/
