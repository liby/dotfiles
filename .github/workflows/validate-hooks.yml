name: validate-hooks

on:
  pull_request:
    paths:
      - ".github/workflows/validate-hooks.yml"
      - "dot_claude/hooks/**"
      - "dot_codex/managed-hooks/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-hooks.yml"
      - "dot_claude/hooks/**"
      - "dot_codex/managed-hooks/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: |
          for t in dot_claude/hooks/*.test.sh; do
            echo "== $t"
            bash "$t"
          done
          bun test dot_codex/managed-hooks/*.test.ts
