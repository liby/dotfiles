name: validate-skills

on:
  pull_request:
    paths: &paths
      - ".github/workflows/validate-skills.yml"
      - "dot_agents/skills/**"
  push:
    branches: [main]
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate managed skills
        # Static mode has no ~/.agents tree or GPG, so encrypted-only deployed skills are skipped.
        run: ruby dot_agents/skills/scripts/validate-skills.rb
