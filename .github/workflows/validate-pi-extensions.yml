name: validate-pi-extensions

on:
  pull_request:
    paths: &paths
      - ".github/workflows/validate-pi-extensions.yml"
      - "private_dot_pi/private_agent/extensions/**"
  push:
    branches: [main]
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pi-extensions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Test Pi extensions
        run: bun test ./private_dot_pi/private_agent/extensions/
