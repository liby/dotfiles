name: validate-actions-lock

on:
  pull_request:
    paths: &paths
      - ".github/workflows/**"
  push:
    branches: [main]
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # renovate: datasource=github-releases depName=github/gh-actions-lock
      GH_ACTIONS_LOCK_VERSION: v0.4.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # GitHub enforces the lockfile only for workflows listed in it, so a workflow
      # added without regenerating the lockfile would run unlocked without notice.
      - name: Verify the workflow lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin "$GH_ACTIONS_LOCK_VERSION"
          gh actions-lock --verify
