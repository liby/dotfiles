name: validate-dev-tools

on:
  pull_request:
    paths: &paths
      - ".github/dev-tools/**"
      - ".github/workflows/validate-dev-tools.yml"
      - "dot_config/uv/uv.toml"
  push:
    branches: [main]
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
      - name: Resolve npm tools
        working-directory: .github/dev-tools
        run: npm install --dry-run --engine-strict --ignore-scripts --package-lock=false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      # pip ignores the release-age window in dot_config/uv/uv.toml and would accept versions
      # the installer refuses.
      - name: Resolve Python tools
        run: |
          uv venv "$RUNNER_TEMP/dev-tools-venv"
          uv pip install \
            --dry-run \
            --python "$RUNNER_TEMP/dev-tools-venv" \
            --config-file dot_config/uv/uv.toml \
            --requirement .github/dev-tools/requirements.txt
