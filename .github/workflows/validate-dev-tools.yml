name: validate-dev-tools

on:
  pull_request:
    paths: &paths
      - ".chezmoiscripts/run_onchange_after_reconcile-dev-tools.sh.tmpl"
      - ".github/dev-tools/**"
      - ".github/workflows/actions.lock"
      - ".github/workflows/validate-dev-tools.yml"
      - "dot_config/uv/uv.toml"
  push:
    branches: [main]
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "lts/*"
      # Apply the installer's release-age window, which also covers transitive dependencies.
      - name: Resolve npm tools
        working-directory: .github/dev-tools
        run: |
          min_release_age="$(sed -n 's/^npm config set min-release-age //p' ../../.chezmoiscripts/run_onchange_after_reconcile-dev-tools.sh.tmpl)"
          npm install --dry-run --engine-strict --ignore-scripts --package-lock=false --min-release-age="${min_release_age:?not set by the installer}"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
      # pip ignores the release-age window in dot_config/uv/uv.toml and would accept versions
      # the installer refuses.
      - name: Resolve Python tools
        run: |
          uv venv "$RUNNER_TEMP/dev-tools-venv"
          uv pip install \
            --dry-run \
            --python "$RUNNER_TEMP/dev-tools-venv" \
            --config-file dot_config/uv/uv.toml \
            --requirement .github/dev-tools/requirements.txt
      - name: Install mbx release
        run: |
          sh .github/dev-tools/install-mbx.sh "$RUNNER_TEMP/mbx-bin"
          "$RUNNER_TEMP/mbx-bin/mbx" --version
