# gitleaks rules for post-bash-scan-secrets.sh. The default rules catch tokens
# by their vendor prefix; these add the two leaks a shell prints without one:
# the credential in an Authorization header, as `curl -v` or a dumped request
# shows it, and a password in a URL. Neither takes a value that starts with `$`
# or `<`, the forms placeholders print in. A Basic credential is base64 of the
# user and password, so it gets a lower length floor than a token, whose floor
# keeps values such as `undefined` quiet; the URL password's entropy floor does
# the same for short repetitive examples such as `password` or `changeme`.
[extend]
useDefault = true

[[rules]]
id = "authorization-header"
description = "Credential in an Authorization header"
regex = '''(?i)\bauthorization\\?["']?\s*:\s*\\?["']?(?:basic\s+([A-Za-z0-9+/]{8,}={0,2})|(?:apikey|bearer|token)\s+([A-Za-z0-9._~+/=-]{20,}))'''
keywords = ["authorization"]

[[rules]]
id = "uri-credential"
description = "Password embedded in a URL"
regex = '''\b[a-zA-Z][a-zA-Z0-9+.-]*://[^\s:/@]*:([^\s/@<$][^\s/@]{7,})@[^\s/]+'''
secretGroup = 1
entropy = 3.0
keywords = ["://"]
