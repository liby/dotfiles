{{- /* chezmoi:modify-template */ -}}
{{- $managed := includeTemplate "codex/browser/config.toml" . | fromToml -}}
{{- $current := .chezmoi.stdin | fromToml -}}
{{- $out := mergeOverwrite (deepCopy $current) $managed -}}
{{- if deepEqual $current $out -}}
  {{- .chezmoi.stdin -}}
{{- else -}}
  {{- $out | toToml -}}
{{- end -}}
