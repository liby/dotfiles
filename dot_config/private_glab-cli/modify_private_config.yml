{{- /* chezmoi:modify-template */ -}}
{{- $managed := includeTemplate "glab/config.yml" . | fromYaml -}}
{{- /* Replace lines instead of round-tripping glab's YAML: toYaml writes every empty field as
      `null`, which glab reads as the literal string. */ -}}
{{- $out := .chezmoi.stdin -}}
{{- if and $out (not (hasSuffix "\n" $out)) -}}
  {{- $out = printf "%s\n" $out -}}
{{- end -}}
{{- range $key, $value := $managed -}}
  {{- $line := printf "%s: %s" $key (quote $value) -}}
  {{- $existing := printf `(?m)^%s:.*$` $key -}}
  {{- if regexMatch $existing $out -}}
    {{- $out = regexReplaceAllLiteral $existing $out $line -}}
  {{- else -}}
    {{- $out = printf "%s%s\n" $out $line -}}
  {{- end -}}
{{- end -}}
{{- $out -}}
