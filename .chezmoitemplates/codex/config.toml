approval_policy = "on-request"
approvals_reviewer = "auto_review"
# Updates belong to unattended-upgrades; disable the startup prompt so unattended launches cannot wait for input.
check_for_update_on_startup = false
cli_auth_credentials_store = "keyring"
default_permissions = "development"
mcp_oauth_credentials_store = "keyring"
model_reasoning_summary = "concise"
project_doc_fallback_filenames = [".claude/CLAUDE.md", "CLAUDE.md"]
suppress_unstable_features_warning = true
web_search = "live"

[analytics]
enabled = false

[desktop]
ambient-suggestions-enabled = false
appshotSoundEnabled = false
composerPlainTextMode = true
enabled-reasoning-efforts = ["medium", "xhigh", "max", "ultra"]
# Keep the selected UI behavior when the desktop default writes queue.
followUpQueueMode = "steer"
git-always-force-push = true
git-branch-prefix = ""
git-pull-request-merge-method = "squash"
mac-menu-bar-enabled = false
open-link-in-target-preference = "external-browser"
# Desktop's power-save blocker is separate from features.prevent_idle_sleep.
preventSleepWhileRunning = true
realtimeVoiceScreenContextEnabled = false
reduced-motion-preference = "on"
reviewDelivery = "detached"
show-context-window-usage = true
show-educational-tips = false
sidebar-show-projects-in-recents = false
usePointerCursors = true
worktree-upstream-refresh-mode = "best-effort"

[desktop.appearanceDarkChromeTheme]
accent = "#339cff"
accentSource = "custom"
contrast = 60
ink = "#ffffff"
opaqueWindows = false
surface = "#181818"

[desktop.appearanceDarkChromeTheme.fonts]

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#40c977"
diffRemoved = "#fa423e"
skill = "#ad7bf9"

[feedback]
enabled = false

[features]
# Start compaction early to reduce foreground waiting; foreground compaction can still wait, and completed usage is charged even if the result is discarded.
async_compaction = true
# Remove once Codex runs hooks and tool commands with the attached client's environment: https://github.com/openai/codex/issues/48500
daemon_auto_start = false
memories = true
network_proxy = true
prevent_idle_sleep = true

[notice]
# The answer here is always to keep the current model, and the prompt blocks the
# session until someone answers it.
hide_rate_limit_model_nudge = true

[permissions.development.filesystem]
":root" = "write"
"{{ .chezmoi.homeDir }}/.codex/plugins/cache/openai-bundled/browser" = "read"
# Codex read entries take exact paths or a trailing `/**`, while git-style globs
# (`*`, `?`, `[`, `]`) are accepted only for deny, so ~/.ssh is denied as a whole
# and only the files ssh and Git signature verification need are reopened by exact
# path; public keys stay unreadable here. Any denied-read entry, this one
# included, also holds every command inside the inner sandbox: exec-policy allow
# and explicit escalation cannot move one out while it is present.
"{{ .chezmoi.homeDir }}/.ssh" = "deny"
"{{ .chezmoi.homeDir }}/.ssh/config" = "read"
"{{ .chezmoi.homeDir }}/.ssh/allowed_signers" = "read"
"{{ .chezmoi.homeDir }}/.ssh/known_hosts" = "write"

[permissions.development.filesystem.":workspace_roots"]
".env" = "read"
".env.local" = "read"

[permissions.development.network]
enabled = true
allow_local_binding = true

[permissions.development.network.domains]
{{ range includeTemplate "sandbox/allowed-domains.json" . | fromJson -}}
{{ . | quote }} = "allow"
{{ end -}}

# Socket rules require absolute paths; `~` prevents the proxy from starting.
[permissions.development.network.unix_sockets]
{{ range includeTemplate "sandbox/allowed-unix-sockets.json" . | fromJson -}}
{{ joinPath $.chezmoi.homeDir (trimPrefix "~/" .) | quote }} = "allow"
{{ end }}
[shell_environment_policy]
# `core` drops REX_*, which Rex needs to identify this agent's pane.
inherit = "all"
# Retain case-insensitive *KEY*, *SECRET*, and *TOKEN* filters on inherited names; other names can still carry secrets, so credentials belong in envchain.
ignore_default_excludes = false

[shell_environment_policy.set]
# Keep Snowflake's localhost SAML listener alive so the snow skill can open an
# emitted login URL while the original query waits. Undocumented connector flag
# (connector auth/webbrowser.py); re-check after CLI upgrades.
SNOWFLAKE_AUTH_FORCE_SERVER = "true"

[tui]
copy_on_select = "never"
status_line = ["model-with-reasoning", "current-dir", "git-branch", "thread-id"]

[mcp_servers.openaiDeveloperDocs]
enabled = true
url = "https://developers.openai.com/mcp"

[mcp_servers.superlogical]
enabled = true
url = "https://www.superlogical.com/rex/community-mcp"

[mcp_servers.node_repl]
# Keep Desktop's runtime-generated launch fields explicit to avoid apply/startup drift.
command = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node_repl"
args = []
startup_timeout_sec = 120

# Sites
[apps.connector_20205bf7d4e99a89d7154bb849718324]
enabled = false

[apps.connector_openai_codex_document_control]
enabled = true

[apps.connector_openai_chatgpt_pets]
enabled = false

[apps.connector_openai_default_templates]
enabled = false

[apps.connector_openai_defense_factory]
enabled = true

[apps.connector_openai_hotline]
enabled = false

[apps.connector_openai_pages]
enabled = false

[apps.connector_openai_plugin_management]
enabled = false

[apps.connector_openai_safety_settings]
enabled = false

# Activate only explicitly enabled plugins that are installed and enabled by their source.
[plugins._default]
enabled = false

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."code-review@openai-bundled"]
enabled = false

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."pages@openai-curated-remote"]
enabled = false

[plugins."presentations@openai-primary-runtime"]
enabled = false

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = false

[plugins."visualize@openai-bundled"]
enabled = true
